<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tenkigo — Poetic Japanese weather words that reflect the season and sky above you.">
  <meta name="theme-color" content="#0F172A">
  <title>Tenkigo — 天気語</title>

  <!-- Favicon (天 character) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>天</text></svg>">

  <!-- Google Fonts: Noto Serif JP (Kanji) · Inter (UI) · Caveat (Handwriting) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@400;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body id="weather-body" data-theme="clear">

  <!-- ===== HEADER ===== -->
  <header id="header">
    <span id="app-title">天気語 | Tenkigo</span>
  </header>

  <!-- ===== MAIN POSTCARD ===== -->
  <main id="postcard">
    <div id="hero-weather">
      <span id="temperature">—</span>
      <span id="city-name">—</span>
      <span id="country-name">—</span>
    </div>

    <div id="kanji-display" role="button" tabindex="0" aria-label="Click to copy Kanji" title="Click to copy">
      <span id="kanji-char">—</span>
      <span id="copy-hint">click to copy</span>
    </div>

    <p id="romaji">...</p>
    <p id="meaning">...</p>

    <div id="season-info">
      <span id="local-climate-label"></span>
    </div>

    <form id="search-form" autocomplete="off">
      <input
        id="city-input"
        type="text"
        placeholder="Search city..."
        aria-label="Search for a city"
      >
      <button id="search-btn" type="submit" aria-label="Search">→</button>
    </form>
  </main>

  <!-- ===== COPY TOAST ===== -->
  <div id="copy-toast" aria-live="polite">コピーしました</div>

  <!-- ===== ERROR MESSAGE ===== -->
  <div id="error-msg" aria-live="polite"></div>

  <!-- ===== LOADING OVERLAY ===== -->
  <div id="loading-overlay">
    <span id="loading-text">天気語</span>
    <span id="loading-sub">reading the weather…</span>

    <div
      id="loading-progress"
      role="progressbar"
      aria-label="Loading weather"
      aria-valuetext="Loading"
    >
      <span></span>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer id="footer">
    <span>Tenkigo Weather Board</span>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
